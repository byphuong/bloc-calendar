  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none;}
  body{
    font-family:var(--body);color:var(--ink);height:100vh;height:100dvh;
    position:relative;
    -webkit-font-smoothing:antialiased;
  }
  /* Noise BG (designer's exact frame texture) fixed behind everything */
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:var(--bg) url("assets/noise-bg.png") center center / cover no-repeat;
  }

  /* ---------- top bar ---------- */
  .topbar{
    position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;justify-content:space-between;
    background:transparent;padding:45px clamp(20px,4vw,64px) 21px;
  }
  .brand-title{
    margin:0;font-family:var(--display);font-weight:700;text-transform:uppercase;
    font-size:clamp(18px,2vw,28px);letter-spacing:.01em;color:var(--ink);line-height:1;
    max-width:320px;
  }
  .nav{position:absolute;left:50%;top:45px;transform:translateX(-50%);display:flex;align-items:center;gap:15px;}
  .btn-today{
    height:44px;padding:0 18px;background:var(--red);color:#fff;border:none;cursor:pointer;
    font-family:var(--display);font-weight:700;font-size:24px;line-height:1;text-transform:none;
    display:inline-flex;align-items:center;transition:transform .08s;
  }
  .btn-today:active{transform:translateY(1px);}
  .topbar-right{display:flex;align-items:center;gap:16px;}
  .vol-btn{
    width:44px;height:44px;flex:none;display:grid;place-items:center;cursor:pointer;
    background:none;border:none;padding:0;color:var(--ink);
  }
  .vol-btn svg{width:24px;height:24px;display:block;}
  .lang-toggle{display:inline-flex;justify-self:end;}
  .lang-btn{
    width:44px;height:44px;display:grid;place-items:center;cursor:pointer;
    font-family:"Be Vietnam Pro";font-weight:700;font-size:12px;letter-spacing:.06em;
    background:#fff;color:var(--ink);border:1.5px solid var(--line);
  }
  .lang-btn:first-child{border-right:none;}
  .lang-btn.active{background:var(--red);color:#fff;border-color:var(--red);}

  /* generic square control button (44x44, 2px black border) */
  .ctrl{
    width:44px;height:44px;flex:none;background:var(--paper2);border:2px solid var(--line);
    display:grid;place-items:center;cursor:pointer;color:var(--ink);transition:background .12s,transform .08s;
  }
  .ctrl:hover{background:#f0eeea;}
  .ctrl:active{transform:translateY(1px);}
  .ctrl svg{width:24px;height:24px;display:block;}

  /* ---------- stage ---------- */
  .viewport-fit{
    position:fixed;left:0;right:0;bottom:0;top:var(--topbar-h,86px);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  .stage{
    position:relative;z-index:2;display:grid;flex:none;
    grid-template-columns:324px minmax(0,1fr) 324px;
    gap:141px;align-items:start;justify-content:center;
    max-width:1600px;padding:35px 48px 70px;
    transform-origin:center center;
  }
  /* fixed to the sheet's total height (tab+sheet) so a growing list can never
     inflate .stage's natural size — the fit-to-viewport script would otherwise
     shrink the whole app to compensate. Overflow is a fallback only; the first
     panel grows to fill the space, the second panel is pinned to a fixed
     height below it, so the bottom panels of both columns always line up. */
  .col-left,.col-right{display:flex;flex-direction:column;gap:32px;
    height:calc(676px * var(--sheet-scale));overflow-y:auto;}
  .col-left{width:324px;}.col-right{width:324px;}
  .col-center{display:flex;justify-content:center;}

  /* ---------- panel heading ---------- */
  .panel{display:flex;flex-direction:column;flex:none;}
  .panel:first-child{flex:1 1 0;min-height:0;}
  .panel:last-child{height:252px;flex:none;}
  .panel-head{
    display:flex;align-items:center;justify-content:space-between;gap:12px;height:44px;
    box-shadow:0 2px 0 0 var(--line);margin-bottom:24px;
  }
  .panel-head-title{display:flex;align-items:center;gap:8px;min-width:0;}
  .panel-head h2{
    margin:0;font-family:var(--display);font-weight:700;font-size:28px;line-height:1;
    color:var(--red);white-space:nowrap;
  }
  .head-icon{width:24px;height:24px;flex:none;color:var(--red);display:grid;place-items:center;}
  .head-icon svg{width:24px;height:24px;display:block;}
  .head-btn{border:none;background:none;cursor:pointer;padding:0;}
  .head-btn svg{transition:transform .18s;}
  .head-btn.open svg{transform:rotate(90deg);}
  .head-add-btn{
    flex:none;width:44px;height:44px;background:#fff;cursor:pointer;padding:0;
    border:2px solid var(--line);border-bottom:none;
    color:var(--ink);display:grid;place-items:center;transition:background .12s;
  }
  .head-add-btn.hidden{display:none;}
  .head-add-btn svg{width:24px;height:24px;display:block;}
  .head-add-btn:hover{background:#f0eeea;}
  .head-add-btn:disabled{opacity:.4;cursor:default;}
  .head-add-btn:disabled:hover{background:#fff;}
  /* section body: list/empty + add button stacked */
  .section-body{display:flex;flex-direction:column;gap:24px;flex:1 1 auto;min-height:0;overflow-y:auto;}
  .panel-empty{margin:0;font-family:"Be Vietnam Pro";font-style:italic;font-weight:500;font-size:12px;color:#686868;}
  .add-btn{
    display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:44px;
    border:2px solid var(--line);background:#fff;cursor:pointer;color:var(--ink);
    font-family:"Be Vietnam Pro";font-weight:600;font-size:14px;transition:background .12s;
  }
  .add-btn:hover{background:#f0eeea;}
  .add-btn svg{width:24px;height:24px;display:block;}

  /* ---------- tasks ---------- */
  .task-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;}
  .task{display:flex;align-items:center;gap:8px;}
  .task .box{
    flex:none;width:24px;height:24px;border:2px solid var(--line);background:#fff;cursor:pointer;
    display:grid;place-items:center;color:transparent;transition:.12s;
  }
  .task .box svg{width:16px;height:16px;}
  .task.done .box{background:var(--line);color:#fff;}
  .task .txt{
    font-family:"Be Vietnam Pro";font-weight:500;font-size:14px;color:var(--ink);
    cursor:pointer;word-break:break-word;
  }
  .task.done .txt{text-decoration:line-through;}
  .task .del{
    margin-left:auto;flex:none;background:none;border:none;color:#b3b0aa;cursor:pointer;
    font-size:18px;line-height:1;padding:2px 4px;opacity:0;transition:opacity .12s,color .12s;
  }
  .task:hover .del{opacity:1;}
  .task .del:hover{color:var(--red);}

  /* ---------- countdown ---------- */
  .cd-list{display:flex;flex-direction:column;gap:0;}
  .cd-card{
    background:#fff;border:2px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:8px;
    position:relative;
  }
  .cd-card + .cd-card{margin-top:31px;}
  .cd-top{display:flex;align-items:center;gap:10px;}
  .cd-name{flex:1;min-width:0;font-family:var(--display);font-weight:700;font-size:24px;line-height:1;color:var(--ink);
    display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cd-name .emoji{font-size:20px;font-family:"Be Vietnam Pro";}
  .cd-num{flex:none;width:84px;margin-right:20px;text-align:center;font-family:var(--display);font-weight:700;font-size:40px;
    line-height:.78;color:var(--ink);}
  .cd-num.small{font-size:20px;}
  .cd-bot{display:flex;align-items:center;gap:10px;
    font-family:"Be Vietnam Pro";font-weight:500;font-size:14px;color:var(--ink);}
  .cd-date{flex:1;min-width:0;}
  .cd-unit{flex:none;width:84px;margin-right:20px;text-align:center;white-space:nowrap;}
  .cd-del{position:absolute;top:6px;right:8px;width:16px;height:16px;display:grid;place-items:center;
    background:none;border:none;color:#c9c6c0;cursor:pointer;padding:0;opacity:0;transition:opacity .12s,color .12s;}
  .cd-del svg{width:16px;height:16px;display:block;}
  .cd-card:hover .cd-del{opacity:1;}
  .cd-del:hover{color:var(--red);}

  /* ---------- world clock ---------- */
  .wc-list{display:flex;flex-direction:column;gap:16px;}
  .wc-card{
    background:#fff;border:2px solid var(--line);padding:16px 12px;display:flex;
    align-items:flex-start;justify-content:space-between;gap:8px;position:relative;
  }
  .wc-left{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0;}
  .wc-city{font-family:var(--display);font-weight:700;font-size:24px;line-height:1;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .wc-sub{font-family:"Be Vietnam Pro";font-weight:500;font-size:14px;color:var(--ink);}
  .wc-time{flex:none;width:84px;text-align:center;font-family:var(--display);font-weight:700;font-size:40px;
    line-height:.78;color:var(--ink);}
  .wc-del{position:absolute;top:8px;right:4px;width:16px;height:16px;display:grid;place-items:center;
    background:none;border:none;color:#c9c6c0;cursor:pointer;padding:0;opacity:0;transition:opacity .12s,color .12s;}
  .wc-del svg{width:16px;height:16px;display:block;}
  .wc-card:hover .wc-del{opacity:1;}
  .wc-del:hover{color:var(--red);}

  /* ---------- pomodoro ---------- */
  .pomo-head-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:8px;width:100%;margin-bottom:24px;}
  .pomo-head-wrap .panel-head{width:100%;margin-bottom:0;}
  .pomo-gear{
    flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--red);background:#fff;
    cursor:pointer;padding:0;display:grid;place-items:center;
  }
  .pomo-gear-dot{width:10px;height:10px;border-radius:50%;background:var(--red);display:block;}
  .pomo-settings-link{
    width:100%;text-align:right;background:none;border:none;cursor:pointer;padding:0;
    font-family:"Be Vietnam Pro";font-weight:500;font-size:14px;color:var(--ink);
  }
  .pomo-settings-link:hover{color:var(--red);}
  .pomo-card{
    background:#fff;border:2px solid var(--line);padding:16px 12px;
    display:flex;align-items:flex-start;justify-content:space-between;width:100%;
  }
  .pomo-left{display:flex;flex-direction:column;align-items:flex-start;gap:12px;}
  .pomo-right{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;align-self:stretch;}
  .pomo-phase{font-family:"Be Vietnam Pro";font-weight:600;font-size:12px;letter-spacing:.04em;
    text-transform:uppercase;color:#9a978f;}
  .pomo-time{font-family:var(--display);font-weight:700;font-size:40px;line-height:.78;color:var(--ink);white-space:nowrap;}
  .pomo-primary{
    font-family:var(--display);font-weight:700;font-size:24px;line-height:1;color:var(--ink);
    background:none;border:none;cursor:pointer;padding:0;
  }
  .pomo-primary:hover{color:var(--red);}
  .pomo-end{
    font-family:"Be Vietnam Pro";font-weight:500;font-size:14px;color:#9a978f;text-align:right;
    background:none;border:none;cursor:pointer;padding:0;
  }
  .pomo-end:hover:not(:disabled){color:var(--red);}
  .pomo-end:disabled{color:#c9c6c0;cursor:default;}
  .pomo-settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  .pomo-field{display:flex;flex-direction:column;gap:8px;}
  .pomo-field-label{font-family:"Be Vietnam Pro";font-weight:600;font-size:11px;letter-spacing:.04em;
    text-transform:uppercase;color:#9a978f;}

  /* ---------- modal (Pomodoro settings layover) ---------- */
  .modal-overlay{
    position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
    background:rgba(13,13,18,.55);padding:24px;
  }
  .modal-overlay.open{display:flex;}
  .modal-card{
    background:#fff;border:2px solid var(--line);width:100%;max-width:380px;padding:24px;
    box-shadow:0 24px 60px rgba(0,0,0,.3);max-height:calc(100vh - 48px);overflow-y:auto;
  }
  .modal-card.info-card{max-width:569px;padding:36px 24px;}
  .modal-card.cc-date-modal{overflow:visible;}
  .modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px;}
  .modal-head h2{margin:0;font-family:var(--display);font-weight:700;font-size:22px;line-height:1.2;color:var(--red);}
  .modal-card.info-card .modal-head{margin-bottom:32px;}
  .modal-card.info-card .modal-head h2{font-size:32px;line-height:1.15;}
  .info-body{display:flex;flex-direction:column;gap:20px;
    font-family:"Be Vietnam Pro";font-weight:500;font-size:14px;line-height:1.5;color:var(--ink);}
  .info-body p{margin:0;}
  .info-body p.info-thanks{color:var(--red);}
  .modal-close{flex:none;width:28px;height:28px;padding:0;border:none;background:none;cursor:pointer;
    color:var(--ink);display:grid;place-items:center;}
  .modal-close:hover{color:var(--red);}
  .modal-close svg{width:20px;height:20px;display:block;}
  .modal-body{display:flex;flex-direction:column;gap:16px;}
  .modal-body input,.modal-body select{
    width:100%;border:2px solid var(--line);background:#fff;font-family:"Be Vietnam Pro";
    font-weight:500;font-size:14px;padding:10px 16px;color:var(--ink);
  }
  .modal-body select{
    padding:10px 40px 10px 16px;
    appearance:none;-webkit-appearance:none;-moz-appearance:none;
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"><path d="M6 9L12 15L18 9" stroke="%230D0D12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>');
    background-repeat:no-repeat;background-position:right 16px center;background-size:16px 16px;
  }
  .modal-body input:focus,.modal-body select:focus{outline:none;border-color:var(--red);}

  /* ---------- Apple-style date picker (used in the "new countdown" modal) ---------- */
  .apple-dp{position:relative;}
  .apple-dp-trigger{
    width:100%;border:2px solid var(--line);background:#fff;font-family:"Be Vietnam Pro";
    font-weight:500;font-size:14px;padding:10px 16px;color:var(--ink);cursor:pointer;
    display:flex;align-items:center;justify-content:space-between;gap:8px;
  }
  .apple-dp-trigger:focus{outline:none;border-color:var(--red);}
  .apple-dp-trigger svg{width:16px;height:16px;flex:none;color:#9a978f;}
  .apple-dp-panel{
    position:absolute;top:calc(100% + 8px);left:0;z-index:20;width:272px;max-width:calc(100vw - 88px);
    background:#fff;border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.18);border:1px solid #ececec;
    padding:12px;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Be Vietnam Pro",sans-serif;
    display:none;
  }
  .apple-dp-panel.open{display:block;}
  .apple-dp-head{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 10px;}
  .apple-dp-month{font-size:15px;font-weight:600;color:var(--ink);}
  .apple-dp-nav{display:flex;gap:2px;}
  .apple-dp-nav button{width:26px;height:26px;border:none;background:none;border-radius:50%;cursor:pointer;
    display:grid;place-items:center;color:var(--ink);transition:background .12s;}
  .apple-dp-nav button:hover{background:#f0f0f2;}
  .apple-dp-nav svg{width:13px;height:13px;}
  .apple-dp-weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;margin-bottom:2px;}
  .apple-dp-weekdays span{font-size:11px;font-weight:600;color:#9a978f;padding:4px 0;display:block;}
  .apple-dp-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
  .apple-dp-day{
    aspect-ratio:1;border:none;background:none;border-radius:50%;font-size:13px;font-weight:500;color:var(--ink);
    cursor:pointer;display:grid;place-items:center;transition:background .12s;font-family:inherit;
  }
  .apple-dp-day:hover{background:#f0f0f2;}
  .apple-dp-day.muted{color:#c8c6c2;}
  .apple-dp-day.today{color:#007aff;font-weight:700;}
  .apple-dp-day.selected{background:#007aff;color:#fff;font-weight:700;}
  .apple-dp-foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding:8px 4px 0;border-top:1px solid #ececec;}
  .apple-dp-link{background:none;border:none;padding:0;font-size:13px;font-weight:500;color:#007aff;cursor:pointer;font-family:inherit;}
  .apple-dp-link:hover{text-decoration:underline;}
  .modal-foot{display:flex;align-items:center;justify-content:flex-end;gap:24px;margin-top:24px;}
  .modal-foot.hidden{display:none;}
  .modal-cancel{background:none;border:none;cursor:pointer;padding:0;
    font-family:"Be Vietnam Pro";font-weight:600;font-size:14px;color:var(--ink);}
  .modal-cancel:hover{color:var(--red);}
  .modal-btn{height:44px;padding:0 24px;border:2px solid var(--line);background:#fff;color:var(--ink);
    font-family:"Be Vietnam Pro";font-weight:600;font-size:14px;cursor:pointer;transition:background .12s;}
  .modal-btn:hover{background:#f0eeea;}
  .modal-btn.primary{background:var(--line);color:#fff;}
  .modal-btn.primary:hover{background:#000;}

  /* ---------- the tear-off sheet ---------- */
  .sheet-wrap{width:var(--sheet-w);max-width:100%;position:relative;}
  /* "What is a bloc calendar?" info trigger — EN only, sits in the gap right above the sheet */
  .info-btn{
    position:absolute;bottom:calc(100% + 8px);right:0;z-index:5;
    width:24px;height:24px;padding:0;border:none;background:none;cursor:pointer;
    color:var(--ink);display:grid;place-items:center;
  }
  .info-btn svg{width:24px;height:24px;display:block;}
  .info-btn:hover{color:var(--red);}
  .info-btn.hidden{display:none;}
  /* red binding tab with two punch holes (stays fixed while the sheet tears away) */
  .sheet-tab{position:relative;z-index:4;width:100%;height:calc(26px * var(--sheet-scale));background:var(--red);
    display:flex;align-items:center;justify-content:center;gap:calc(184px * var(--sheet-scale));
    box-shadow:0 1px 0 rgba(0,0,0,.12);}
  .sheet-tab .hole{width:calc(12px * var(--sheet-scale));height:calc(12px * var(--sheet-scale));border-radius:50%;background:#fff;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.35);}
  /* layered stack: the leaving sheet sits above the revealed next sheet */
  .sheet-stack{position:relative;perspective:calc(2200px * var(--sheet-scale));perspective-origin:50% 0;}
  .sheet{
    width:var(--sheet-w);max-width:100%;min-height:calc(650px * var(--sheet-scale));background:var(--paper);
    border:2px solid var(--red);border-top:none;
    box-shadow:0 calc(16px * var(--sheet-scale)) calc(56px * var(--sheet-scale)) rgba(0,0,0,.15);
    padding:calc(16px * var(--sheet-scale));color:var(--ink);display:flex;flex-direction:column;gap:calc(39.33px * var(--sheet-scale));
    cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;
    transform-origin:top center;will-change:transform,opacity;backface-visibility:hidden;
  }
  #sheet{position:relative;z-index:2;}
  /* the next day, revealed underneath as the current sheet is torn off */
  .sheet-back{position:absolute;inset:0;z-index:1;visibility:hidden;pointer-events:none;
    cursor:default;}
  .sheet.grabbing{cursor:grabbing;}
  .sheet.dropin{animation:dropin .42s cubic-bezier(.2,.7,.2,1);}
  @keyframes dropin{from{transform:rotateX(-26deg) translateY(-12px);opacity:.25;}to{transform:none;opacity:1;}}
  /* torn perforation edge that flashes along the top as a sheet is ripped away */
  .tear-perf{position:absolute;left:0;right:0;top:0;height:calc(7px * var(--sheet-scale));z-index:3;pointer-events:none;opacity:0;
    background:repeating-linear-gradient(90deg,var(--red) 0 calc(4px * var(--sheet-scale)),transparent calc(4px * var(--sheet-scale)) calc(8px * var(--sheet-scale)));}
  .sheet-stack.ripping .tear-perf{animation:perfFlash .5s ease;}
  @keyframes perfFlash{0%{opacity:0;}20%{opacity:.9;}100%{opacity:0;}}

  .s-top{position:relative;display:flex;align-items:baseline;justify-content:space-between;height:calc(34px * var(--sheet-scale));
    font-family:var(--display);font-weight:700;text-transform:uppercase;color:var(--ink);}
  .s-top .s-month-vi{font-size:calc(28px * var(--sheet-scale));line-height:1;}
  .s-top .s-year{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:calc(29px * var(--sheet-scale));line-height:1;white-space:nowrap;}
  .s-top .s-month-en{font-size:calc(28px * var(--sheet-scale));line-height:1;text-align:right;}

  .s-hero{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
  .s-wd-vi,.s-wd-en{font-family:var(--display);font-weight:700;font-size:calc(28px * var(--sheet-scale));line-height:1;
    text-transform:uppercase;color:var(--ink);}
  .s-day{font-family:"Barber Complete","Danh Da",serif;font-size:calc(128px * var(--sheet-scale));line-height:.92;color:var(--ink);
    margin:calc(8px * var(--sheet-scale)) 0 calc(32px * var(--sheet-scale));letter-spacing:-2px;}
  .s-hero.holiday .s-wd-vi,.s-hero.holiday .s-wd-en,.s-hero.holiday .s-day{color:var(--red);}

  /* almanac */
  .s-alm{display:flex;flex-direction:column;gap:calc(20px * var(--sheet-scale));}
  .alm-lunarrow{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:calc(8px * var(--sheet-scale));
    font-family:var(--display);font-weight:700;color:var(--ink);}
  .alm-lmonth{font-size:calc(24px * var(--sheet-scale));line-height:1.1;max-width:calc(110px * var(--sheet-scale));}
  .alm-lmonth-cap{display:block;font-size:calc(16px * var(--sheet-scale));}
  .alm-lday{position:absolute;left:50%;bottom:0;transform:translateX(-50%);font-size:calc(64px * var(--sheet-scale));line-height:.8;color:var(--red);white-space:nowrap;}
  .alm-lyear{font-size:calc(24px * var(--sheet-scale));line-height:1.1;text-align:right;max-width:calc(110px * var(--sheet-scale));}

  .alm-grid{display:flex;flex-direction:column;gap:calc(20px * var(--sheet-scale));}
  .alm-row{display:flex;align-items:flex-start;justify-content:space-between;gap:calc(12px * var(--sheet-scale));
    font-family:"Be Vietnam Pro";font-size:calc(12px * var(--sheet-scale));line-height:calc(16px * var(--sheet-scale));color:var(--ink);}
  .alm-col{display:flex;flex-direction:column;gap:calc(4px * var(--sheet-scale));min-width:0;}
  .alm-col.right{text-align:right;align-items:flex-end;}
  .alm-col b{font-weight:700;}
  .alm-col .lab{font-weight:700;}
  .alm-item{display:flex;gap:calc(4px * var(--sheet-scale));}
  .alm-col.right .alm-item{justify-content:flex-end;}

  /* week strip */
  .s-bottom{display:flex;flex-direction:column;gap:calc(19px * var(--sheet-scale));align-items:center;}
  .week-strip{display:flex;align-items:stretch;justify-content:space-between;gap:calc(18px * var(--sheet-scale));width:100%;}

<script>
/* ===== Âm lịch — Hồ Ngọc Đức, TZ=+7 (reused engine) ===== */
const TZ=7;
function jdFromDate(dd,mm,yy){const a=Math.floor((14-mm)/12),y=yy+4800-a,m=mm+12*a-3;let jd=dd+Math.floor((153*m+2)/5)+365*y+Math.floor(y/4)-Math.floor(y/100)+Math.floor(y/400)-32045;if(jd<2299161)jd=dd+Math.floor((153*m+2)/5)+365*y+Math.floor(y/4)-32083;return jd;}
function NewMoon(k){const T=k/1236.85,T2=T*T,T3=T2*T,dr=Math.PI/180;let Jd1=2415020.75933+29.53058868*k+0.0001178*T2-0.000000155*T3;Jd1+=0.00033*Math.sin((166.56+132.87*T-0.009173*T2)*dr);const M=359.2242+29.10535608*k-0.0000333*T2-0.00000347*T3;const Mpr=306.0253+385.81691806*k+0.0107306*T2+0.00001236*T3;const F=21.2964+390.67050646*k-0.0016528*T2-0.00000239*T3;let C1=(0.1734-0.000393*T)*Math.sin(M*dr)+0.0021*Math.sin(2*dr*M);C1=C1-0.4068*Math.sin(Mpr*dr)+0.0161*Math.sin(dr*2*Mpr);C1=C1-0.0004*Math.sin(dr*3*Mpr);C1=C1+0.0104*Math.sin(dr*2*F)-0.0051*Math.sin(dr*(M+Mpr));C1=C1-0.0074*Math.sin(dr*(M-Mpr))+0.0004*Math.sin(dr*(2*F+M));C1=C1-0.0004*Math.sin(dr*(2*F-M))-0.0006*Math.sin(dr*(2*F+Mpr));C1=C1+0.0010*Math.sin(dr*(2*F-Mpr))+0.0005*Math.sin(dr*(2*Mpr+M));let deltat;if(T<-11)deltat=0.001+0.000839*T+0.0002261*T2-0.00000845*T3-0.000000081*T*T3;else deltat=-0.000278+0.000265*T+0.000262*T2;return Jd1+C1-deltat;}
function SunLongitude(jdn){const T=(jdn-2451545.0)/36525,T2=T*T,dr=Math.PI/180;const M=357.52910+35999.05030*T-0.0001559*T2-0.00000048*T*T2;const L0=280.46645+36000.76983*T+0.0003032*T2;let DL=(1.914600-0.004817*T-0.000014*T2)*Math.sin(dr*M);DL+=(0.019993-0.000101*T)*Math.sin(dr*2*M)+0.000290*Math.sin(dr*3*M);let L=(L0+DL)*dr;L=L-Math.PI*2*Math.floor(L/(Math.PI*2));return L;}
const getSunLongitude=(d,tz)=>Math.floor(SunLongitude(d-0.5-tz/24)/Math.PI*6);
const getNewMoonDay=(k,tz)=>Math.floor(NewMoon(k)+0.5+tz/24);
function getLunarMonth11(yy,tz){const off=jdFromDate(31,12,yy)-2415021;let k=Math.floor(off/29.530588853);let nm=getNewMoonDay(k,tz);if(getSunLongitude(nm,tz)>=9)nm=getNewMoonDay(k-1,tz);return nm;}
function getLeapMonthOffset(a11,tz){let k=Math.floor((a11-2415021.076998695)/29.530588853+0.5),last=0,i=1;let arc=getSunLongitude(getNewMoonDay(k+i,tz),tz);do{last=arc;i++;arc=getSunLongitude(getNewMoonDay(k+i,tz),tz);}while(arc!=last&&i<14);return i-1;}
function solar2lunar(dd,mm,yy,tz=TZ){const dayNumber=jdFromDate(dd,mm,yy);const k=Math.floor((dayNumber-2415021.076998695)/29.530588853);let monthStart=getNewMoonDay(k+1,tz);if(monthStart>dayNumber)monthStart=getNewMoonDay(k,tz);let a11=getLunarMonth11(yy,tz),b11=a11,lunarYear;if(a11>=monthStart){lunarYear=yy;a11=getLunarMonth11(yy-1,tz);}else{lunarYear=yy+1;b11=getLunarMonth11(yy+1,tz);}const lunarDay=dayNumber-monthStart+1;const diff=Math.floor((monthStart-a11)/29);let lunarLeap=0,lunarMonth=diff+11;if(b11-a11>365){const lo=getLeapMonthOffset(a11,tz);if(diff>=lo){lunarMonth=diff+10;if(diff==lo)lunarLeap=1;}}if(lunarMonth>12)lunarMonth-=12;if(lunarMonth>=11&&diff<4)lunarYear-=1;let ms=getNewMoonDay(k+1,tz),ns;if(ms>dayNumber){ms=getNewMoonDay(k,tz);ns=getNewMoonDay(k+1,tz);}else ns=getNewMoonDay(k+2,tz);return {lunarDay,lunarMonth,lunarYear,lunarLeap,jd:dayNumber,monthLen:ns-ms};}

function sexagenary(can,chi){for(let n=0;n<60;n++)if(n%10===can&&n%12===chi)return n;return 0;}

/* 12 trực */
const TRUC=["Kiến","Trừ","Mãn","Bình","Định","Chấp","Phá","Nguy","Thành","Thu","Khai","Bế"];

const getTruc=(lm,dayChi)=>TRUC[(dayChi-((lm+1)%12)+12)%12];

/* good/fair hours */
const GIO_HD=["110100101100","001101001011","110011010010","101100110100","001011001101","010010110011"];
function goodHours(dayChi){const row=GIO_HD[dayChi%6],out=[];for(let i=0;i<12;i++)if(row[i]==='1')out.push(i);return out;}

/* lục hợp (compatible) & lục xung (clash) by chi */
const LUC_HOP=[1,0,11,10,9,8,7,6,5,4,3,2];       // Tý-Sửu, Dần-Hợi, Mão-Tuất, Thìn-Dậu, Tỵ-Thân, Ngọ-Mùi
const lucXung=chi=>(chi+6)%12;

/* western zodiac */
const CUNG=[
  {to:[1,19],vi:"Ma Kết",en:"Capricorn"},{to:[2,18],vi:"Bảo Bình",en:"Aquarius"},

function getHoliday(sd,sm,ld,lm,leap){
  if(lm===1&&ld===1)return{vi:"Tết Nguyên Đán · Mùng Một",en:"Lunar New Year",tet:true,red:true};
  if(lm===1&&(ld===2||ld===3))return{vi:"Tết Nguyên Đán · Mùng "+ld,en:"Lunar New Year · Day "+ld,tet:true,red:true};
  if(lm===12&&ld>=29)return{vi:"Giao thừa · Tất niên",en:"New Year's Eve",tet:true,red:true};
  if(lm===1&&ld===15)return{vi:"Tết Nguyên Tiêu",en:"Lantern Festival",red:true};
  if(lm===12&&ld===23)return{vi:"Ông Công Ông Táo",en:"Kitchen Gods' Day",red:false};
  if(lm===3&&ld===10&&!leap)return{vi:"Giỗ Tổ Hùng Vương",en:"Hùng Kings' Festival",red:true};
  if(lm===5&&ld===5)return{vi:"Tết Đoan Ngọ",en:"Đoan Ngọ Festival",red:true};
  if(lm===7&&ld===15)return{vi:"Lễ Vu Lan",en:"Vu Lan Festival",red:true};
  if(lm===8&&ld===15)return{vi:"Tết Trung Thu",en:"Mid-Autumn Festival",red:true};
  if(sm===1&&sd===1)return{vi:"Tết Dương Lịch",en:"New Year's Day",red:true};
  if(sm===4&&sd===30)return{vi:"Giải phóng miền Nam",en:"Reunification Day",red:true};
  if(sm===5&&sd===1)return{vi:"Quốc tế Lao động",en:"Labour Day",red:true};

  if(sm===3&&sd===8)return{vi:"Quốc tế Phụ nữ",en:"Women's Day",red:false};
  if(sm===11&&sd===20)return{vi:"Ngày Nhà giáo VN",en:"Teachers' Day",red:false};
  return null;
}

function isoWeek(date){const d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));const nn=(d.getUTCDay()+6)%7;d.setUTCDate(d.getUTCDate()-nn+3);const f=new Date(Date.UTC(d.getUTCFullYear(),0,4));return 1+Math.round(((d-f)/86400000-3+((f.getUTCDay()+6)%7))/7);}

/* ===== tear interaction — real bloc tear-off =====
   The next/previous day is pre-rendered on a hidden layer directly beneath the
   current sheet, so tearing the top sheet away reveals the new day underneath
   (never a fade to background). The sheet peels from the top binding, folds
   forward and drops, with a perforation flash along the torn top edge. */
const reduceMotion=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
let animating=false, preparedDir=0;

function prepBack(dir){
  const target=new Date(current);target.setDate(target.getDate()+dir);
  buildSheet(target,sheetBack);
  sheetBack.className='sheet sheet-back';
  sheetBack.style.visibility='visible';
  preparedDir=dir;
}
function hideBack(){sheetBack.style.visibility='hidden';preparedDir=0;}
function finishSwap(dir){
  current.setDate(current.getDate()+dir);
  sheet.style.transition='none';
  sheet.style.transform='';sheet.style.opacity='';sheet.style.boxShadow='';
  sheet.className='sheet';
  buildSheet(current,sheet);                 // front now equals the revealed sheet
  renderTasks();
  requestAnimationFrame(()=>{hideBack();sheet.style.transition='';});
  animating=false;renderCountdown();
}
function tearAway(dir,fromDrag){
  animating=true;
  if(preparedDir!==dir)prepBack(dir);
  playTearSound();
  sheetStack.classList.add('ripping');
  setTimeout(()=>sheetStack.classList.remove('ripping'),520);
  if(reduceMotion){finishSwap(dir);return;}
  if(!fromDrag){sheet.style.transition='none';sheet.style.transform='translateY(0) rotateX(0deg)';void sheet.offsetWidth;}
  const end=dir>0
    ? 'translateY(150%) rotateX(-78deg) rotateZ(1.5deg)'    // folds forward & down, flops off the pad
    : 'translateY(-132%) rotateX(64deg) rotateZ(-1.5deg)';  // lifts back up to reveal the previous day
  sheet.style.transition='transform .6s cubic-bezier(.34,.02,.4,1), opacity .5s ease .06s, box-shadow .3s ease';
  sheet.style.boxShadow='0 26px 40px rgba(0,0,0,.20)';
  requestAnimationFrame(()=>{sheet.style.transform=end;sheet.style.opacity='0';});
  setTimeout(()=>finishSwap(dir),600);
}
function go(dir){if(animating)return;tearAway(dir,false);}
function snapBack(){
  sheet.style.transition='transform .3s cubic-bezier(.2,.8,.2,1), opacity .3s ease, box-shadow .3s ease';
  sheet.style.transform='';sheet.style.opacity='';sheet.style.boxShadow='';
  setTimeout(()=>{sheet.style.transition='';hideBack();},300);
}
let dragging=false,startY=0,curDy=0,activePointer=null;
sheet.addEventListener('pointerdown',e=>{if(animating)return;if(e.target.closest('.week-day'))return;dragging=true;startY=e.clientY;curDy=0;activePointer=e.pointerId;try{sheet.setPointerCapture(e.pointerId);}catch(_){}sheet.style.transition='none';sheet.style.boxShadow='0 14px 26px rgba(0,0,0,.14)';sheet.classList.add('grabbing');});
sheet.addEventListener('pointermove',e=>{
  if(!dragging)return;curDy=e.clientY-startY;const dir=curDy>=0?1:-1;
  if(Math.abs(curDy)>6&&preparedDir!==dir)prepBack(dir);   // reveal the day underneath as you peel
  const prog=Math.min(Math.abs(curDy)/220,1);
  sheet.style.transform=`translateY(${curDy}px) rotateX(${-dir*prog*14}deg)`;
  sheet.style.opacity=String(1-prog*0.25);
});
function endDrag(){
  if(!dragging)return;dragging=false;sheet.classList.remove('grabbing');
  try{sheet.releasePointerCapture(activePointer);}catch(_){}
  if(Math.abs(curDy)>90)tearAway(curDy>0?1:-1,true);else snapBack();
}
sheet.addEventListener('pointerup',endDrag);sheet.addEventListener('pointercancel',endDrag);
/* trackpad / mouse-wheel: two-finger swipe or scroll up/down flips the day (no drag needed) */
let wheelCd=false,wheelAccum=0,wheelTimer=null;
sheet.addEventListener('wheel',e=>{
  if(dragging)return;
  if(Math.abs(e.deltaY)<=Math.abs(e.deltaX))return; // let horizontal scroll pass through
  e.preventDefault();
  if(animating||wheelCd)return;
  wheelAccum+=e.deltaY;
  clearTimeout(wheelTimer);wheelTimer=setTimeout(()=>{wheelAccum=0;},180);
  if(Math.abs(wheelAccum)>=48){
    const dir=wheelAccum>0?1:-1;wheelAccum=0;wheelCd=true;
    go(dir);
    setTimeout(()=>{wheelCd=false;},640);
  }
},{passive:false});

/* GMT offset in minutes for a timezone at a given instant (handles DST) */
function tzOffsetMin(tz,date){
  const part=new Intl.DateTimeFormat('en-US',{timeZone:tz,timeZoneName:'shortOffset'}).formatToParts(date).find(p=>p.type==='timeZoneName').value;
  const m=part.match(/GMT([+-])(\d{1,2})(?::(\d{2}))?/);
  if(!m)return 0;
  return (m[1]==='-'?-1:1)*(parseInt(m[2],10)*60+(m[3]?parseInt(m[3],10):0));
}
function cityInfo(tz){
  const now=new Date();
  const parts=new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'2-digit',minute:'2-digit',hour12:false,
    year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(now);
  const get=k=>parts.find(p=>p.type===k).value;
  let hh=get('hour');if(hh==='24')hh='00';
  const time=hh+':'+get('minute');
  const cityKey=get('year')+'-'+get('month')+'-'+get('day');
  const localKey=fmtKey(now);
  let dayLbl=t().todayLbl;
  if(cityKey!==localKey)dayLbl=(new Date(cityKey)>new Date(localKey))?t().tomorrowLbl:t().yesterdayLbl;
  const diffHrs=Math.round((tzOffsetMin(tz,now)-(-now.getTimezoneOffset()))/60);
  const offsetStr=(diffHrs>=0?'+':'-')+Math.abs(diffHrs)+'hrs';
  return {time,dayLbl,offsetStr};
}

/* Apple-style dropdown calendar: replaces the browser's native <input type="date">
   picker (which renders with inconsistent, non-brand UI across browsers/OSes) with a
   custom widget modeled on macOS/iOS's date picker — rounded panel, SF font, blue
   accent, circular day selection. Keeps a hidden input in sync so existing read
   sites (`#evDateInput.value`) don't need to change. */
function initDatePicker(root,initialIso){
  let selected=isoToDate(initialIso);
  let view=new Date(selected.getFullYear(),selected.getMonth(),1);
  const trigger=root.querySelector('.apple-dp-trigger'),panel=root.querySelector('.apple-dp-panel'),
    label=root.querySelector('.apple-dp-label'),hidden=root.querySelector('#evDateInput');
  const WD=lang==='vi'?["T2","T3","T4","T5","T6","T7","CN"]:["M","T","W","T","F","S","S"];
  panel.querySelector('.apple-dp-weekdays').innerHTML=WD.map(w=>`<span>${w}</span>`).join('');
  function setSelected(d){selected=d;hidden.value=fmtKey(d);label.textContent=fmtDp(d);}
  function render(){
    const y=view.getFullYear(),m=view.getMonth();
    panel.querySelector('.apple-dp-month').textContent=(lang==='vi'?('Tháng '+MONTH_VI_NAME[m]):cap(MONTH_EN[m]))+' '+y;
    const startDow=(new Date(y,m,1).getDay()+6)%7,daysInMonth=new Date(y,m+1,0).getDate(),daysInPrev=new Date(y,m,0).getDate();
    let html='';
    for(let i=0;i<startDow;i++)html+=`<button type="button" class="apple-dp-day muted" data-nav="-1" data-day="${daysInPrev-startDow+1+i}">${daysInPrev-startDow+1+i}</button>`;
    for(let d=1;d<=daysInMonth;d++){
      const cur=new Date(y,m,d),isToday=cur.getTime()===realToday.getTime(),isSel=cur.getTime()===selected.getTime();
      html+=`<button type="button" class="apple-dp-day${isToday?' today':''}${isSel?' selected':''}" data-day="${d}">${d}</button>`;
    }
    const trailing=(7-((startDow+daysInMonth)%7))%7;
    for(let i=1;i<=trailing;i++)html+=`<button type="button" class="apple-dp-day muted" data-nav="1" data-day="${i}">${i}</button>`;
    const grid=panel.querySelector('.apple-dp-days');grid.innerHTML=html;
    grid.querySelectorAll('.apple-dp-day').forEach(btn=>btn.addEventListener('click',()=>{
      const day=Number(btn.dataset.day);
      if(btn.dataset.nav==='-1')view.setMonth(view.getMonth()-1);
      else if(btn.dataset.nav==='1')view.setMonth(view.getMonth()+1);
      setSelected(new Date(view.getFullYear(),view.getMonth(),day));
      closePanel();
    }));
  }
  function openPanel(){panel.classList.add('open');render();}
  function closePanel(){panel.classList.remove('open');}
  panel.querySelector('.apple-dp-prev').addEventListener('click',()=>{view.setMonth(view.getMonth()-1);render();});
  panel.querySelector('.apple-dp-next').addEventListener('click',()=>{view.setMonth(view.getMonth()+1);render();});
  panel.querySelector('.apple-dp-today').addEventListener('click',()=>{view=new Date(realToday.getFullYear(),realToday.getMonth(),1);setSelected(new Date(realToday));closePanel();});
  panel.querySelector('.apple-dp-clear').addEventListener('click',()=>{hidden.value='';label.textContent=t().evDatePh;closePanel();});
  trigger.addEventListener('click',e=>{e.stopPropagation();panel.classList.contains('open')?closePanel():openPanel();});
  const outsideHandler=e=>{if(!root.contains(e.target))closePanel();};
  document.addEventListener('click',outsideHandler);
  setSelected(selected);
  return ()=>document.removeEventListener('click',outsideHandler);
}

/* ===== pomodoro =====
   Focus timer that cycles focus → short break → focus → … → long break,
   all durations and the long-break interval configurable via the settings
   link/gear. State persists to localStorage as an epoch target so it keeps
   counting correctly even across a reload while running. */
function loadPomo(){
  const defaults={focusMin:50,breakMin:10,longBreakMin:30,sessionsUntilLong:4,
    mode:'focus',sessionCount:0,remainingSec:50*60,running:false,target:null};
  try{
    const v=JSON.parse(localStorage.getItem('lichbloc:pomodoro'));
    if(v&&typeof v.focusMin==='number')return Object.assign({},defaults,v);
  }catch(e){}
  return defaults;
}
function savePomo(){localStorage.setItem('lichbloc:pomodoro',JSON.stringify(pomo));}
function fmtMMSS(sec){sec=Math.max(0,sec);const m=Math.floor(sec/60),s=sec%60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}
let pomo=loadPomo(),pomoTimer=null;
function pomoDurationSec(mode){
  mode=mode||pomo.mode||'focus';
  if(mode==='break')return pomo.breakMin*60;
  if(mode==='longBreak')return pomo.longBreakMin*60;
  return pomo.focusMin*60;
}
function pomoRemaining(){return (pomo.running&&pomo.target)?Math.round((pomo.target-Date.now())/1000):pomo.remainingSec;}
function pomoTick(){
  const rem=pomoRemaining();
  const el=document.getElementById('pomoTime');if(el)el.textContent=fmtMMSS(rem);
  if(rem<=0){
    clearInterval(pomoTimer);pomoTimer=null;
    playPomoAlert();
    if(pomo.mode==='focus'){
      pomo.sessionCount=(pomo.sessionCount||0)+1;
      pomo.mode=(pomo.sessionCount%pomo.sessionsUntilLong===0)?'longBreak':'break';
    }else{
      pomo.mode='focus';
    }
    pomo.running=false;pomo.remainingSec=pomoDurationSec();pomo.target=null;savePomo();
    renderPomodoro();
  }
}
function pomoStart(){
  const rem=pomo.remainingSec!=null?pomo.remainingSec:pomoDurationSec();
  pomo.running=true;pomo.target=Date.now()+rem*1000;savePomo();
  clearInterval(pomoTimer);pomoTimer=setInterval(pomoTick,1000);
  renderPomodoro();
}
function pomoPause(){
  pomo.remainingSec=pomoRemaining();pomo.running=false;pomo.target=null;savePomo();
  clearInterval(pomoTimer);pomoTimer=null;
  renderPomodoro();
}
function pomoStop(){
  pomo.running=false;pomo.target=null;pomo.mode='focus';pomo.remainingSec=pomo.focusMin*60;savePomo();
  clearInterval(pomoTimer);pomoTimer=null;
  renderPomodoro();
}
function renderPomodoro(){
  const L10=t();
  const timeEl=document.getElementById('pomoTime'),primary=document.getElementById('pomoPrimary'),
    end=document.getElementById('pomoEnd'),phaseEl=document.getElementById('pomoPhase');
  if(timeEl)timeEl.textContent=fmtMMSS(pomoRemaining());
  const fresh=!pomo.running&&pomo.remainingSec===pomoDurationSec();
  if(primary)primary.textContent=pomo.running?L10.pomoPause:(fresh?L10.pomoStart:L10.pomoContinue);
  if(end){end.textContent=L10.pomoEnd;end.disabled=fresh&&pomo.mode==='focus';}
  if(phaseEl)phaseEl.textContent=pomo.mode==='longBreak'?L10.pomoLongBreak:(pomo.mode==='break'?L10.pomoBreak:L10.pomoFocus);
}

/* ===== tear-off paper sound — soft synthesized rustle, no audio file needed ===== */
let audioCtx=null;
function playTearSound(){
  if(!volOn)return;
  try{
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
    const ctx=audioCtx,dur=0.55,sampleRate=ctx.sampleRate,len=Math.floor(sampleRate*dur);
    const buffer=ctx.createBuffer(1,len,sampleRate),data=buffer.getChannelData(0);
    let prev=0;
    for(let i=0;i<len;i++){
      const t=i/len;
      const rustle=0.7+0.3*Math.sin(t*26+Math.sin(t*60)*1.5);      // slow, gentle wobble
      const attack=Math.min(1,t/0.06);                              // soft fade-in, no click
      const envelope=attack*Math.pow(1-t,1.6)*rustle;
      const raw=(Math.random()*2-1)*envelope;
      prev=prev*0.72+raw*0.28;                                      // light smoothing = softer grain
      data[i]=prev;
    }
    const noise=ctx.createBufferSource();noise.buffer=buffer;
    const lowpass=ctx.createBiquadFilter();lowpass.type='lowpass';lowpass.frequency.value=2600;lowpass.Q.value=0.4;
    const bandpass=ctx.createBiquadFilter();bandpass.type='bandpass';bandpass.frequency.value=1100;bandpass.Q.value=0.5;
    const highpass=ctx.createBiquadFilter();highpass.type='highpass';highpass.frequency.value=300;
    const gain=ctx.createGain();
    gain.gain.setValueAtTime(0.001,ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.32,ctx.currentTime+0.05);
    gain.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+dur);
    noise.connect(lowpass).connect(bandpass).connect(highpass).connect(gain).connect(ctx.destination);
    noise.start();noise.stop(ctx.currentTime+dur);
  }catch(e){}
}

/* ===== task-done chime — quick soft upward blip, no audio file needed ===== */
function playTaskDoneSound(){
  if(!volOn)return;
  try{
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
    const ctx=audioCtx,notes=[698.46,1046.5];                         // F5 → C6, short upward blip
    notes.forEach((freq,i)=>{
      const start=ctx.currentTime+i*0.07;
      const osc=ctx.createOscillator();osc.type='sine';osc.frequency.value=freq;
      const gain=ctx.createGain();
      gain.gain.setValueAtTime(0.0001,start);
      gain.gain.linearRampToValueAtTime(0.22,start+0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001,start+0.22);
      osc.connect(gain).connect(ctx.destination);
      osc.start(start);osc.stop(start+0.24);
    });
  }catch(e){}
}

/* ===== pomodoro alert — soft two-note chime, no audio file needed ===== */
function playPomoAlert(){
  if(!volOn)return;
  try{
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
    const ctx=audioCtx,notes=[880,1108.73];                          // A5 → C#6, gentle major third
    notes.forEach((freq,i)=>{
      const start=ctx.currentTime+i*0.16;
      const osc=ctx.createOscillator();osc.type='sine';osc.frequency.value=freq;
      const gain=ctx.createGain();
      gain.gain.setValueAtTime(0.0001,start);
      gain.gain.linearRampToValueAtTime(0.2,start+0.03);              // soft attack, no click
      gain.gain.exponentialRampToValueAtTime(0.0001,start+1.1);
      osc.connect(gain).connect(ctx.destination);
      osc.start(start);osc.stop(start+1.15);
    });
  }catch(e){}
}

/* ===== fit the whole stage into the viewport below the fixed topbar — no page scroll at any resolution ===== */
(function(){
  const topbarEl=document.querySelector('.topbar');
  const fitEl=document.getElementById('viewportFit');
  const stageEl=document.getElementById('stage');
  let raf=null;
  function apply(){
    document.documentElement.style.setProperty('--topbar-h',topbarEl.offsetHeight+'px');
    const availW=fitEl.clientWidth,availH=fitEl.clientHeight;
    const natW=stageEl.offsetWidth,natH=stageEl.offsetHeight;
    if(!natW||!natH)return;
    const scale=Math.min(availW/natW,availH/natH,1.5);
    stageEl.style.transform='scale('+scale+')';
  }
  function schedule(){if(raf)cancelAnimationFrame(raf);raf=requestAnimationFrame(apply);}
  window.addEventListener('resize',schedule);
  window.addEventListener('orientationchange',schedule);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(schedule);
  new ResizeObserver(schedule).observe(stageEl);
  new ResizeObserver(schedule).observe(topbarEl);
  apply();
})();
</script>
