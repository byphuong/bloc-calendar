  :root{
    --ink:#0d0d12;
    --paper:#ffffff;
    --paper2:#fffbfb;
    --line:#000000;
    --gray:#d3d3d3;
    --gray-line:#d3d3d3;
    --red:#c8202b;
    --bg:#e9e6e1;
    --display:"Danh Da","Be Vietnam Pro",system-ui,sans-serif;
    --body:"Be Vietnam Pro",system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--body);color:var(--ink);min-height:100vh;
    background:var(--bg);position:relative;overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  /* plaster / concrete texture */
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.4'/></svg>");
    mix-blend-mode:multiply;opacity:.5;
  }
  body::after{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(140% 120% at 20% 0%, rgba(255,255,255,.5), transparent 55%),
      radial-gradient(120% 120% at 90% 100%, rgba(0,0,0,.06), transparent 60%);
  }

  /* ---------- top bar ---------- */
  .topbar{
    position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;
    background:#fff;border-bottom:2px solid var(--line);height:86px;padding:0 clamp(20px,4vw,64px);
  }
  .brand-title{
    margin:0;font-family:var(--display);font-weight:700;text-transform:uppercase;
    font-size:clamp(18px,2vw,28px);letter-spacing:.01em;color:var(--ink);line-height:1;
    max-width:320px;
  }
  .nav{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:15px;}
  .btn-today{
    height:44px;padding:0 18px;background:var(--line);color:#fff;border:none;cursor:pointer;
    font-family:var(--display);font-weight:700;font-size:24px;line-height:1;text-transform:none;
    display:inline-flex;align-items:center;transition:transform .08s;
  }
  .btn-today:active{transform:translateY(1px);}
  .lang-toggle{display:inline-flex;justify-self:end;}
  .lang-btn{
    width:44px;height:44px;display:grid;place-items:center;cursor:pointer;
    font-family:"Be Vietnam Pro";font-weight:700;font-size:12px;letter-spacing:.06em;
    background:#fff;color:var(--ink);border:1.5px solid var(--line);
  }
  .lang-btn:first-child{border-right:none;}
  .lang-btn.active{background:var(--line);color:#fff;border-color:var(--line);}

  /* generic square control button (44x44, 2px black border) */
  .ctrl{
    width:44px;height:44px;flex:none;background:var(--paper2);border:2px solid var(--line);
    display:grid;place-items:center;cursor:pointer;color:var(--ink);transition:background .12s,transform .08s;
  }
  .ctrl:hover{background:#f0eeea;}
  .ctrl:active{transform:translateY(1px);}
  .ctrl svg{width:24px;height:24px;display:block;}

  /* ---------- stage ---------- */
  .stage{
    position:relative;z-index:2;display:grid;
    grid-template-columns:324px minmax(0,1fr) 324px;
    gap:clamp(24px,3vw,64px);align-items:start;justify-content:center;
    max-width:1400px;margin:0 auto;padding:35px clamp(20px,4vw,64px) 70px;
  }
  .col-left,.col-right{display:flex;flex-direction:column;gap:28px;}
  .col-left{width:324px;align-self:stretch;}.col-right{width:324px;}
  .col-center{display:flex;justify-content:center;}
  /* Groove anchored to the bottom-left corner (aligns with the calendar's bottom) */
  .groove-panel{margin-top:auto;}

  /* ---------- panel heading ---------- */
  .panel{display:flex;flex-direction:column;}
  .panel-head{
    display:flex;align-items:center;justify-content:space-between;gap:12px;height:44px;
    border-bottom:2px solid var(--line);margin-bottom:24px;
  }
  .panel-head h2{
    margin:0;font-family:var(--display);font-weight:700;font-size:28px;line-height:1;
    color:var(--ink);white-space:nowrap;
  }
  .head-icon{width:24px;height:24px;flex:none;color:var(--ink);display:grid;place-items:center;}
  .head-icon svg{width:24px;height:24px;display:block;}
  .head-btn{border:none;background:none;cursor:pointer;padding:0;}
  .head-btn svg{transition:transform .18s;}
  .head-btn.open svg{transform:rotate(90deg);}
  /* section body: list/empty + add button stacked */
  .section-body{display:flex;flex-direction:column;gap:16px;}
  .panel-empty{font-family:"Be Vietnam Pro";font-style:italic;font-weight:500;font-size:12px;color:#686868;}
  .add-btn{
    display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:44px;
    border:2px solid var(--line);background:#fff;cursor:pointer;color:var(--ink);
    font-family:"Be Vietnam Pro";font-weight:500;font-size:14px;transition:background .12s;
  }
  .add-btn:hover{background:#f0eeea;}
  .add-btn svg{width:24px;height:24px;display:block;}
  /* inline add form */
  .add-form{display:flex;flex-direction:column;gap:8px;}
  .add-form input{
    width:100%;border:2px solid var(--line);background:#fff;font-family:"Be Vietnam Pro";
    font-weight:500;font-size:14px;padding:9px 10px;color:var(--ink);
  }
  .add-form input::placeholder{color:#9a978f;}
  .add-form input:focus{outline:none;}
  .add-form .form-row{display:flex;gap:8px;}
  .add-form .form-row .fbtn{
    flex:1;height:40px;border:2px solid var(--line);cursor:pointer;background:#fff;color:var(--ink);
    font-family:"Be Vietnam Pro";font-weight:600;font-size:13px;transition:background .12s;
  }
  .add-form .form-row .fbtn.primary{background:var(--line);color:#fff;}
  .add-form .form-row .fbtn:hover{background:#f0eeea;}
  .add-form .form-row .fbtn.primary:hover{background:#000;}

  /* ---------- tasks ---------- */
  .task-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;}
  .task{display:flex;align-items:center;gap:8px;}
  .task .box{
    flex:none;width:24px;height:24px;border:2px solid var(--line);background:#fff;cursor:pointer;
    display:grid;place-items:center;color:transparent;transition:.12s;
  }
  .task .box svg{width:16px;height:16px;}
  .task.done .box{background:var(--line);color:#fff;}
  .task .txt{
    font-family:"Be Vietnam Pro";font-weight:500;font-size:14px;color:var(--ink);
    cursor:pointer;word-break:break-word;
  }
  .task.done .txt{text-decoration:line-through;}
  .task .del{
    margin-left:auto;flex:none;background:none;border:none;color:#b3b0aa;cursor:pointer;
    font-size:18px;line-height:1;padding:2px 4px;opacity:0;transition:opacity .12s,color .12s;
  }
  .task:hover .del{opacity:1;}
  .task .del:hover{color:var(--red);}

  /* ---------- groove (Apple Music embed frame) ---------- */
  .groove-panel .section-body{flex:1;}
  .groove-frame{border:2px solid var(--line);background:#fff;overflow:hidden;min-height:300px;}
  .groove-frame iframe{display:block;width:100%;height:300px;border:0;background:transparent;}
  .am-form{display:flex;flex-direction:column;gap:8px;}
  .am-form input{width:100%;border:2px solid var(--line);background:#fff;font-family:"Be Vietnam Pro";
    font-weight:500;font-size:13px;padding:8px 10px;color:var(--ink);}
  .am-form input::placeholder{color:#9a978f;}
  .am-form input:focus{outline:none;}
  .am-form .am-hint{font-family:"Be Vietnam Pro";font-style:italic;font-weight:500;font-size:11px;color:#686868;}

  /* ---------- countdown ---------- */
  .cd-list{display:flex;flex-direction:column;gap:0;}
  .cd-card{
    background:#fff;border:2px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:8px;
    position:relative;
  }
  .cd-card + .cd-card{margin-top:31px;}
  .cd-top{display:flex;align-items:center;gap:10px;}
  .cd-name{flex:1;min-width:0;font-family:var(--display);font-weight:700;font-size:24px;line-height:1;color:var(--ink);
    display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cd-name .emoji{font-size:20px;font-family:"Be Vietnam Pro";}
  .cd-num{flex:none;width:84px;text-align:center;font-family:var(--display);font-weight:700;font-size:40px;
    line-height:.78;color:var(--ink);}
  .cd-num.small{font-size:20px;}
  .cd-bot{display:flex;align-items:center;gap:10px;
    font-family:"Be Vietnam Pro";font-weight:500;font-size:14px;color:var(--ink);}
  .cd-date{flex:1;min-width:0;}
  .cd-unit{flex:none;width:84px;text-align:center;white-space:nowrap;}
  .cd-del{position:absolute;top:6px;right:8px;background:none;border:none;color:#c9c6c0;cursor:pointer;
    font-size:16px;line-height:1;opacity:0;transition:opacity .12s,color .12s;}
  .cd-card:hover .cd-del{opacity:1;}
  .cd-del:hover{color:var(--red);}

  /* ---------- the tear-off sheet ---------- */
  .sheet-wrap{perspective:1800px;width:388px;max-width:100%;position:relative;}
  /* black binding tab with two punch holes */
  .sheet-tab{width:100%;height:26px;background:var(--line);display:flex;align-items:center;
    justify-content:center;gap:184px;}
  .sheet-tab .hole{width:12px;height:12px;border-radius:50%;background:#fff;}
  .sheet{
    width:388px;max-width:100%;min-height:650px;background:var(--paper);
    border:2px solid var(--line);border-top:none;
    padding:16px 16px 14px;color:var(--ink);display:flex;flex-direction:column;
    cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;
    transform-origin:top center;will-change:transform;
  }
  .sheet.grabbing{cursor:grabbing;}
  .sheet.dropin{animation:dropin .4s ease;}
  @keyframes dropin{from{transform:rotateX(-24deg) translateY(-10px);opacity:.3;}to{transform:none;opacity:1;}}

  .s-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;

<script>
/* ===== Âm lịch — Hồ Ngọc Đức, TZ=+7 (reused engine) ===== */
const TZ=7;
function jdFromDate(dd,mm,yy){const a=Math.floor((14-mm)/12),y=yy+4800-a,m=mm+12*a-3;let jd=dd+Math.floor((153*m+2)/5)+365*y+Math.floor(y/4)-Math.floor(y/100)+Math.floor(y/400)-32045;if(jd<2299161)jd=dd+Math.floor((153*m+2)/5)+365*y+Math.floor(y/4)-32083;return jd;}
function NewMoon(k){const T=k/1236.85,T2=T*T,T3=T2*T,dr=Math.PI/180;let Jd1=2415020.75933+29.53058868*k+0.0001178*T2-0.000000155*T3;Jd1+=0.00033*Math.sin((166.56+132.87*T-0.009173*T2)*dr);const M=359.2242+29.10535608*k-0.0000333*T2-0.00000347*T3;const Mpr=306.0253+385.81691806*k+0.0107306*T2+0.00001236*T3;const F=21.2964+390.67050646*k-0.0016528*T2-0.00000239*T3;let C1=(0.1734-0.000393*T)*Math.sin(M*dr)+0.0021*Math.sin(2*dr*M);C1=C1-0.4068*Math.sin(Mpr*dr)+0.0161*Math.sin(dr*2*Mpr);C1=C1-0.0004*Math.sin(dr*3*Mpr);C1=C1+0.0104*Math.sin(dr*2*F)-0.0051*Math.sin(dr*(M+Mpr));C1=C1-0.0074*Math.sin(dr*(M-Mpr))+0.0004*Math.sin(dr*(2*F+M));C1=C1-0.0004*Math.sin(dr*(2*F-M))-0.0006*Math.sin(dr*(2*F+Mpr));C1=C1+0.0010*Math.sin(dr*(2*F-Mpr))+0.0005*Math.sin(dr*(2*Mpr+M));let deltat;if(T<-11)deltat=0.001+0.000839*T+0.0002261*T2-0.00000845*T3-0.000000081*T*T3;else deltat=-0.000278+0.000265*T+0.000262*T2;return Jd1+C1-deltat;}
function SunLongitude(jdn){const T=(jdn-2451545.0)/36525,T2=T*T,dr=Math.PI/180;const M=357.52910+35999.05030*T-0.0001559*T2-0.00000048*T*T2;const L0=280.46645+36000.76983*T+0.0003032*T2;let DL=(1.914600-0.004817*T-0.000014*T2)*Math.sin(dr*M);DL+=(0.019993-0.000101*T)*Math.sin(dr*2*M)+0.000290*Math.sin(dr*3*M);let L=(L0+DL)*dr;L=L-Math.PI*2*Math.floor(L/(Math.PI*2));return L;}
const getSunLongitude=(d,tz)=>Math.floor(SunLongitude(d-0.5-tz/24)/Math.PI*6);

function solar2lunar(dd,mm,yy,tz=TZ){const dayNumber=jdFromDate(dd,mm,yy);const k=Math.floor((dayNumber-2415021.076998695)/29.530588853);let monthStart=getNewMoonDay(k+1,tz);if(monthStart>dayNumber)monthStart=getNewMoonDay(k,tz);let a11=getLunarMonth11(yy,tz),b11=a11,lunarYear;if(a11>=monthStart){lunarYear=yy;a11=getLunarMonth11(yy-1,tz);}else{lunarYear=yy+1;b11=getLunarMonth11(yy+1,tz);}const lunarDay=dayNumber-monthStart+1;const diff=Math.floor((monthStart-a11)/29);let lunarLeap=0,lunarMonth=diff+11;if(b11-a11>365){const lo=getLeapMonthOffset(a11,tz);if(diff>=lo){lunarMonth=diff+10;if(diff==lo)lunarLeap=1;}}if(lunarMonth>12)lunarMonth-=12;if(lunarMonth>=11&&diff<4)lunarYear-=1;let ms=getNewMoonDay(k+1,tz),ns;if(ms>dayNumber){ms=getNewMoonDay(k,tz);ns=getNewMoonDay(k+1,tz);}else ns=getNewMoonDay(k+2,tz);return {lunarDay,lunarMonth,lunarYear,lunarLeap,jd:dayNumber,monthLen:ns-ms};}

/* ===== render sheet ===== */
function buildSheet(d){
  const sd=d.getDate(),sm=d.getMonth()+1,sy=d.getFullYear(),dow=d.getDay();
  const L=solar2lunar(sd,sm,sy);
  const cd=canChiDay(L.jd),cy=canChiYear(L.lunarYear),cm=canChiMonth(L.lunarYear,L.lunarMonth);
  const hol=getHoliday(sd,sm,L.lunarDay,L.lunarMonth,L.lunarLeap);
  const truc=getTruc(L.lunarMonth,cd.chi),ti=TRUC_INFO[truc];
  const el=dayElement(cd.can,cd.chi);
  const sao=dayMansion(L.jd);
  const gh=goodHours(cd.chi);
  const good=gh.slice(0,4),fair=gh.slice(4);
  const cung=westernZodiac(sd,sm);
  const hopChi=LUC_HOP[cd.chi],kyChi=lucXung(cd.chi);
  const prov=PROVERBS[((L.jd%PROVERBS.length)+PROVERBS.length)%PROVERBS.length];
  const L10=t();
  const isVi=lang==='vi';

  const monthVi="Tháng "+MONTH_VI_NAME[sm-1];
  const monthEn=MONTH_EN[sm-1];
  const wdVi=WEEKDAY_VI[dow], wdEn=WEEKDAY_EN[dow];
  const lunarMonthName="Tháng "+LUNAR_MONTH_VI[L.lunarMonth-1]+(L.lunarLeap?" (nhuận)":"");
  const lunarYearName="Năm "+CAN[cy.can]+" "+CHI[cy.chi];
  const trucName=isVi?truc:truc+" ("+TRUC_EN[truc]+")";
  const elName=isVi?el:NAPAM_EN[el];
  const doTxt=isVi?ti.do:ti.doEn, dontTxt=isVi?ti.dont:ti.dontEn;
  const cungName=isVi?cung.vi:cung.en;
  const holName=hol?(isVi?hol.vi:hol.en):"";

  const heroCls=(hol&&hol.red)||dow===0?" holiday":"";

  /* week strip */
  const n=(dow+6)%7;const mon=new Date(d);mon.setDate(d.getDate()-n);
  let weekHTML="";
  for(let i=0;i<7;i++){
    const wd=new Date(mon);wd.setDate(mon.getDate()+i);
    const same=fmtKey(wd)===fmtKey(d);const sun=wd.getDay()===0;
    weekHTML+=`<div class="week-day${same?' today':''}${sun?' sun':''}" data-date="${fmtKey(wd)}" role="button" tabindex="0">
      <small>${(isVi?WEEKDAY_SHORT_VI:WEEKDAY_SHORT_EN)[wd.getDay()]}</small><b>${wd.getDate()}</b></div>`;
  }

  sheet.innerHTML=`
    <div class="s-top">
      <span class="s-month-vi">${isVi?monthVi:monthEn}</span>
      <span class="s-year">${sy}</span>
      <span class="s-month-en">${isVi?monthEn:monthVi}</span>
    </div>
    <div class="s-hero${heroCls}">
      <div class="s-wd-vi">${isVi?wdVi:wdEn}</div>
      <div class="s-day">${sd}</div>
      <div class="s-wd-en">${isVi?wdEn:wdVi}</div>
    </div>
    <div class="s-alm">
      <div class="alm-lunarrow">
        <span class="alm-lmonth">${lunarMonthName}</span>
        <span class="alm-lday">${L.lunarDay}</span>
        <span class="alm-lyear">${lunarYearName}</span>
      </div>
      <div class="alm-grid">
        <div class="alm-row">
          <div class="alm-col">
            <span>${L10.kMonth} ${CAN[cm.can]} ${CHI[cm.chi]}</span>
            <span>${L10.kDay} ${CAN[cd.can]} ${CHI[cd.chi]}</span>
            <span>${L10.kHour} ${CAN[(cd.can*2)%10]} Tý</span>
          </div>
          <div class="alm-col right">
            <span class="alm-item"><b>${L10.kElement}:</b> ${elName}</span>
            <span class="alm-item"><b>${L10.kStar}:</b> ${sao}</span>
            <span class="alm-item"><b>${L10.kTruc}:</b> ${trucName}</span>
          </div>
        </div>
        <div class="alm-row">
          <div class="alm-col">
            <span class="alm-item"><b>${L10.kDo}:</b> ${doTxt}</span>
            <span class="alm-item"><b>${L10.kDont}:</b> ${dontTxt}</span>
          </div>
          <div class="alm-col right">
            <span class="alm-item"><b>${L10.kHop}:</b> ${CHI[hopChi]}</span>
            <span class="alm-item"><b>${L10.kKy}:</b> ${CHI[kyChi]}</span>
          </div>
        </div>
        <div class="alm-row">
          <div class="alm-col">
            <span class="alm-item"><b>${L10.kGood}:</b> ${good.join(", ")}</span>
            <span class="alm-item"><b>${L10.kFair}:</b> ${fair.join(", ")||"—"}</span>
          </div>
          <div class="alm-col right">
            <span class="lab">${L10.kCung}:</span>
            <span>${cungName}</span>
          </div>
        </div>
      </div>
    </div>
    <div class="s-bottom">
      <div class="week-strip">
        <div class="week-no"><small>${L10.week}</small><b>${isoWeek(d)}</b></div>
        <div class="week-days">${weekHTML}</div>
      </div>
      <div class="s-proverb">${holName?('“'+holName+'”'):('“'+(isVi?prov.vi:prov.en)+'”')}</div>
    </div>`;

  sheet.querySelectorAll('.week-day').forEach(elm=>{
    const jump=()=>{const [y,m,dd]=elm.dataset.date.split('-').map(Number);current=new Date(y,m-1,dd);renderSheet('dropin');};
    elm.addEventListener('click',jump);
    elm.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();jump();}});
  });
}
function isoWeek(date){const d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));const nn=(d.getUTCDay()+6)%7;d.setUTCDate(d.getUTCDate()-nn+3);const f=new Date(Date.UTC(d.getUTCFullYear(),0,4));return 1+Math.round(((d-f)/86400000-3+((f.getUTCDay()+6)%7))/7);}

function renderSheet(anim){
  sheet.className='sheet'+(anim?' '+anim:'');
  buildSheet(current);
  renderTasks();
}

/* ===== tear interaction ===== */
const reduceMotion=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
let animating=false;
function go(dir){
  if(animating)return;animating=true;hideHint();
  const advance=()=>{current.setDate(current.getDate()+dir);sheet.style.transition='';sheet.style.transform='';sheet.style.opacity='';renderSheet('dropin');animating=false;renderCountdown();};
  if(reduceMotion){advance();return;}
  sheet.style.transition='transform .5s cubic-bezier(.5,.02,.4,1), opacity .45s ease';
  sheet.style.transform=dir>0?'translateY(135%) rotateX(70deg)':'translateY(-120%) rotateX(-66deg)';
  sheet.style.opacity='0';setTimeout(advance,480);
}
function snapBack(){sheet.style.transition='transform .32s ease, opacity .32s ease';sheet.style.transform='';sheet.style.opacity='';setTimeout(()=>{sheet.style.transition='';},320);}
let dragging=false,startY=0,curDy=0,activePointer=null;
sheet.addEventListener('pointerdown',e=>{if(animating)return;if(e.target.closest('.week-day'))return;dragging=true;startY=e.clientY;curDy=0;activePointer=e.pointerId;try{sheet.setPointerCapture(e.pointerId);}catch(_){}sheet.style.transition='none';sheet.classList.add('grabbing');});
sheet.addEventListener('pointermove',e=>{if(!dragging)return;curDy=e.clientY-startY;const dir=curDy>=0?1:-1;const prog=Math.min(Math.abs(curDy)/220,1);sheet.style.transform=`translateY(${curDy}px) rotateX(${dir*prog*13}deg)`;sheet.style.opacity=String(1-prog*0.3);});
function endDrag(){if(!dragging)return;dragging=false;sheet.classList.remove('grabbing');try{sheet.releasePointerCapture(activePointer);}catch(_){}sheet.style.transition='';if(Math.abs(curDy)>90)go(curDy>0?1:-1);else snapBack();}
sheet.addEventListener('pointerup',endDrag);sheet.addEventListener('pointercancel',endDrag);
/* trackpad / mouse-wheel: two-finger swipe or scroll up/down flips the day (no drag needed) */
let wheelCd=false,wheelAccum=0,wheelTimer=null;
sheet.addEventListener('wheel',e=>{
  if(dragging)return;
  if(Math.abs(e.deltaY)<=Math.abs(e.deltaX))return; // let horizontal scroll pass through
  e.preventDefault();
  if(animating||wheelCd)return;
  wheelAccum+=e.deltaY;
  clearTimeout(wheelTimer);wheelTimer=setTimeout(()=>{wheelAccum=0;},180);
  if(Math.abs(wheelAccum)>=48){
    const dir=wheelAccum>0?1:-1;wheelAccum=0;wheelCd=true;
    go(dir);
    setTimeout(()=>{wheelCd=false;},640);
  }
},{passive:false});
let hintGone=localStorage.getItem('lichbloc:hint')==='1';
function hideHint(){if(hintGone)return;hintGone=true;localStorage.setItem('lichbloc:hint','1');document.getElementById('dragHint').classList.add('gone');}

/* ===== tasks (per day) ===== */
function tasksKey(){return 'lichbloc:tasks:'+fmtKey(current);}
function loadTasks(){try{return JSON.parse(localStorage.getItem(tasksKey()))||[];}catch(e){return [];}}
function saveTasks(x){localStorage.setItem(tasksKey(),JSON.stringify(x));}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const CHECK_SVG='<svg viewBox="0 0 24 24" fill="none"><path d="M5 12l5 5L19 6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const PLUS_SVG='<svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>';
let taskAdding=false;
function renderTasks(){
  const list=document.getElementById('taskList'),tasks=loadTasks();
  list.innerHTML='';
  if(!tasks.length){
    list.innerHTML='<li class="panel-empty">'+t().emptyTasks+'</li>';
  }else{
    tasks.forEach((tk,i)=>{
      const li=document.createElement('li');li.className='task'+(tk.done?' done':'');
      li.innerHTML=`<span class="box" role="checkbox" aria-checked="${tk.done}" tabindex="0">${CHECK_SVG}</span>
        <span class="txt">${escapeHtml(tk.text)}</span>
        <button class="del" aria-label="Xoá">×</button>`;
      const toggle=()=>{tasks[i].done=!tasks[i].done;saveTasks(tasks);renderTasks();};
      li.querySelector('.box').addEventListener('click',toggle);
      li.querySelector('.box').addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();toggle();}});
      li.querySelector('.txt').addEventListener('click',toggle);
      li.querySelector('.del').addEventListener('click',()=>{tasks.splice(i,1);saveTasks(tasks);renderTasks();});
      list.appendChild(li);
    });
  }
  renderTaskAdd();
}
function renderTaskAdd(){
  const slot=document.getElementById('taskAddSlot');
  if(!taskAdding){
    slot.innerHTML=`<button class="add-btn" id="taskAddBtn">${PLUS_SVG}<span>${t().addTask}</span></button>`;
    slot.querySelector('#taskAddBtn').addEventListener('click',()=>{taskAdding=true;renderTaskAdd();});
    return;
  }
  slot.innerHTML=`<div class="add-form">
      <input type="text" id="taskInput" placeholder="${t().taskPh}" maxlength="120" autocomplete="off" />
      <div class="form-row">
        <button class="fbtn primary" id="taskSave">${t().add}</button>
        <button class="fbtn" id="taskCancel">${t().cancel}</button>
      </div>
    </div>`;
  const inp=slot.querySelector('#taskInput');inp.focus();
  const save=()=>{const v=inp.value.trim();if(v){const x=loadTasks();x.push({text:v,done:false});saveTasks(x);}taskAdding=false;renderTasks();};
  const cancel=()=>{taskAdding=false;renderTasks();};
  slot.querySelector('#taskSave').addEventListener('click',save);
  slot.querySelector('#taskCancel').addEventListener('click',cancel);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();save();}if(e.key==='Escape')cancel();});
}

/* ===== countdown ===== */
function nextTet(from){let d=new Date(from);d.setHours(0,0,0,0);for(let i=0;i<420;i++){const L=solar2lunar(d.getDate(),d.getMonth()+1,d.getFullYear());if(L.lunarMonth===1&&L.lunarDay===1)return new Date(d);d.setDate(d.getDate()+1);}return null;}
/* new users start with an empty countdown (empty state) */
function loadEvents(){try{const v=JSON.parse(localStorage.getItem('lichbloc:events'));return Array.isArray(v)?v:[];}catch(e){return [];}}
function saveEvents(x){localStorage.setItem('lichbloc:events',JSON.stringify(x));}
function fmtEvDate(d){return (lang==='vi'?WEEKDAY_SHORT_VI:WEEKDAY_SHORT_EN)[d.getDay()]+', '+String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear();}
let cdAdding=false;
function renderCountdown(){
  const wrap=document.getElementById('cdList'),evs=loadEvents();
  wrap.innerHTML='';
  if(!evs.length){
    wrap.innerHTML='<p class="panel-empty">'+t().emptyCd+'</p>';
  }else{
    evs.forEach((ev,idx)=>{
      const [y,m,dd]=ev.date.split('-').map(Number);const date=new Date(y,m-1,dd);date.setHours(0,0,0,0);
      const days=Math.round((date-realToday)/86400000);
      let numTxt,numCls='',unit;
      if(days>0){numTxt=days;unit=t().daysLeft;}
      else if(days===0){numTxt=t().dayLabel;numCls=' small';unit='';}
      else{numTxt=Math.abs(days);unit=t().passed;}
      const card=document.createElement('div');card.className='cd-card';
      card.innerHTML=`
        <button class="cd-del" aria-label="Xoá">×</button>
        <div class="cd-top">
          <span class="cd-name"><span class="emoji">${ev.emoji||'📌'}</span>${escapeHtml(ev.name)}</span>
          <span class="cd-num${numCls}">${numTxt}</span>
        </div>
        <div class="cd-bot">
          <span class="cd-date">${fmtEvDate(date)}</span>
          <span class="cd-unit">${unit}</span>
        </div>`;
      card.querySelector('.cd-del').addEventListener('click',()=>{const e2=loadEvents();e2.splice(idx,1);saveEvents(e2);renderCountdown();});
      wrap.appendChild(card);
    });
  }
  renderCdAdd();
}
function renderCdAdd(){
  const slot=document.getElementById('cdAddSlot');
  if(!cdAdding){
    slot.innerHTML=`<button class="add-btn" id="cdAddBtn">${PLUS_SVG}<span>${t().addCd}</span></button>`;
    slot.querySelector('#cdAddBtn').addEventListener('click',()=>{cdAdding=true;renderCdAdd();});
    return;
  }
  const defDate=fmtKey(new Date(realToday.getTime()+30*86400000));
  slot.innerHTML=`<div class="add-form">
      <input type="text" id="evNameInput" placeholder="${t().evNamePh}" maxlength="40" autocomplete="off" />
      <input type="date" id="evDateInput" value="${defDate}" aria-label="${t().evDatePh}" />
      <div class="form-row">
        <button class="fbtn primary" id="evSave">${t().add}</button>
        <button class="fbtn" id="evCancel">${t().cancel}</button>
      </div>
    </div>`;
  const nameInp=slot.querySelector('#evNameInput'),dateInp=slot.querySelector('#evDateInput');nameInp.focus();
  const save=()=>{
    const nm=nameInp.value.trim(),dt=dateInp.value;
    if(nm&&/^\d{4}-\d{2}-\d{2}$/.test(dt)){const evs=loadEvents();evs.push({id:'ev-'+Date.now(),name:nm,emoji:'📌',date:dt});saveEvents(evs);}
    cdAdding=false;renderCountdown();
  };
  const cancel=()=>{cdAdding=false;renderCountdown();};
  slot.querySelector('#evSave').addEventListener('click',save);
  slot.querySelector('#evCancel').addEventListener('click',cancel);
  nameInp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();save();}if(e.key==='Escape')cancel();});
  dateInp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();save();}if(e.key==='Escape')cancel();});
}

/* ===== Groove (Apple Music embed) =====
   One embedded Apple Music playlist, framed in the brutalist border. Uses Apple's
   official embed.music.apple.com player (Apple's own dev token — no Apple Developer
   account needed). Full songs when signed into Apple Music, else 30s previews.
   Needs a secure context (https/localhost), NOT file://.
   The waveform icon in the heading opens a paste field to change the playlist. */
const DEFAULT_GROOVE='https://music.apple.com/fi/playlist/viet-wine-bar/pl.u-zPyLmGLIe6GV63G';
let grooveChanging=false;
function amEmbedUrl(u){
  try{
    const url=new URL((u||'').trim());
    if(!/(^|\.)music\.apple\.com$/.test(url.hostname))return null;
    url.hostname='embed.music.apple.com';url.protocol='https:';
    return url.toString();
  }catch(e){return null;}
}
function loadGroove(){return localStorage.getItem('lichbloc:groove')||amEmbedUrl(DEFAULT_GROOVE);}
function saveGroove(u){localStorage.setItem('lichbloc:groove',u);}
function renderGroove(){
  const frame=document.getElementById('grooveFrame'),src=loadGroove();
  frame.innerHTML='';
  const f=document.createElement('iframe');
  f.setAttribute('allow','autoplay *; encrypted-media *; clipboard-write');
  f.setAttribute('loading','lazy');f.src=src;
  frame.appendChild(f);
  renderGrooveForm();
}
function renderGrooveForm(){
  const slot=document.getElementById('amSlot'),btn=document.getElementById('grooveChange');
  btn.classList.toggle('open',grooveChanging);
  if(!grooveChanging){slot.innerHTML='';return;}
  slot.innerHTML=`<div class="am-form">
      <input type="text" id="amInput" inputmode="url" placeholder="${t().amPh}" autocomplete="off" />
      <p class="am-hint">${t().amHint}</p>
      <div class="form-row">
        <button class="fbtn primary" id="amSave">${t().save}</button>
        <button class="fbtn" id="amCancel">${t().cancel}</button>
      </div>
    </div>`;
  const inp=slot.querySelector('#amInput');inp.focus();
  const save=()=>{
    const em=amEmbedUrl(inp.value);
    if(!em){inp.style.borderColor='var(--red)';inp.focus();return;}
    saveGroove(em);grooveChanging=false;renderGroove();
  };
  const cancel=()=>{grooveChanging=false;renderGrooveForm();};
  slot.querySelector('#amSave').addEventListener('click',save);
  slot.querySelector('#amCancel').addEventListener('click',cancel);
  inp.addEventListener('input',()=>{inp.style.borderColor='';});
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();save();}if(e.key==='Escape')cancel();});
}
document.getElementById('grooveChange').addEventListener('click',()=>{grooveChanging=!grooveChanging;renderGrooveForm();});
